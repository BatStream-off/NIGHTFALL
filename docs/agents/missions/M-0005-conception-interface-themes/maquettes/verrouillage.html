<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Verrouillage — barre de titre</title>
<link rel="stylesheet" href="ds.css"><style>
.win { position: relative; width: 1280px; height: 800px; overflow: hidden; background: radial-gradient(70% 50% at 50% 100%, color-mix(in oklab, var(--c-accent) 30%, transparent), transparent), var(--c-bg); }
.band { position: absolute; left: 0; right: 0; top: 0; height: 40px; outline: 1px dashed #ffb86b88; }
.wc { position: absolute; right: 0; top: 0; display: flex; height: 40px; } .wc span { width: 46px; display: grid; place-items: center; color: var(--c-text-2); }
.wc svg.i { stroke-width: 1.2; }
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -56%); width: 360px; display: grid; justify-items: center; gap: 12px; background: none; border: 0; box-shadow: none; }
.card img { width: 76px; filter: drop-shadow(0 0 24px color-mix(in oklab, var(--c-accent) 60%, transparent)); }
.name { font: 600 20px/1 var(--f-display); letter-spacing: .42em; padding-left: .42em; }
.hz { width: 56px; height: 2px; border-radius: 2px; background: var(--c-horizon); margin: 6px 0 10px; }
.pin { width: 100%; height: 48px; border-radius: 12px; background: var(--c-surface); border: 1px solid var(--c-line-strong); display: flex; align-items: center; justify-content: center; gap: 14px; }
.pin i { width: 10px; height: 10px; border-radius: 50%; background: var(--c-text); font-style: normal; } .pin i.e { background: var(--c-line-strong); }
.btn.lg { width: 100%; }
.anno { color: #ffb86b; font: 500 11px var(--f-mono); position: absolute; }
</style></head><body><div class="win"><div class="band"></div>
<div class="wc"><span><i data-i="winmin"></i></span><span><i data-i="winmax"></i></span><span><i data-i="winclose"></i></span></div>
<div class="anno" style="left:16px;top:48px">bande de déplacement 40 px (app-region: drag) — même hauteur que la bande d'onglets ; boutons de fenêtre Windows / feux macOS toujours présents</div>
<div class="card"><img src="../../../../../app/ui/emblem.png"><div class="name">NIGHTFALL</div><div class="hz"></div>
<div class="pin"><i></i><i></i><i></i><i></i><i class="e"></i><i class="e"></i></div>
<span class="btn primary lg">Déverrouiller</span><span class="btn quiet sm">Code oublié ?</span></div>
</div><script src="icons.js"></script></body></html>
