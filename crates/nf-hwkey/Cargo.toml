[package]
name = "nf-hwkey"
description = "NIGHTFALL: device-bound secret (TPM 2.0 on Windows, Keychain on macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# CI end-to-end test only: replaces the TPM/Keychain with a key file so the
# test cannot hang on a system prompt. Never enabled in released builds
# (checked by the "Contrôles de sécurité" CI job).
insecure-software-backend-for-ci = []

[dependencies]
nf-core.workspace = true
nf-crypto.workspace = true
thiserror.workspace = true
serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile.workspace = true
