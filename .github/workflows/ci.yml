name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: Build
        run: cargo build --workspace --exclude nightfall --exclude xtask
      - name: Tests
        run: cargo test --workspace --exclude nightfall --exclude xtask --no-fail-fast
      - name: Trousseau macOS (Keychain réel)
        if: runner.os == 'macOS'
        env:
          NIGHTFALL_TEST_KEYCHAIN: "1"
        run: |
          security create-keychain -p nf-ci nf-ci.keychain
          security set-keychain-settings nf-ci.keychain
          security unlock-keychain -p nf-ci nf-ci.keychain
          security list-keychains -d user -s nf-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s nf-ci.keychain
          perl -e 'alarm 180; exec @ARGV' cargo test -p nf-hwkey keychain_round_trip -- --nocapture
      - name: Rendu de l'interface (navigateur sans affichage)
        if: runner.os == 'Linux'
        run: |
          rm -rf "$RUNNER_TEMP/ui" && cp -r app/ui "$RUNNER_TEMP/ui"
          sed -i "s#'nightfall://app/api/'#'/api/'#" "$RUNNER_TEMP/ui/nf.js"
          NF_UI_DIR="$RUNNER_TEMP/ui" NF_PORT=8765 python3 ci/ui_mock_server.py &
          NF_UI_DIR="$RUNNER_TEMP/ui" NF_PORT=8766 NF_UNLOCKED=1 python3 ci/ui_mock_server.py &
          sleep 1
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm install --silent playwright@1 && npx playwright install --with-deps chromium > /dev/null
          node "$GITHUB_WORKSPACE/ci/ui_render_test.js"
      - name: Lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --exclude nightfall --exclude xtask --all-targets -- -D warnings

  app:
    name: Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          key: app
      - name: Version
        shell: bash
        run: echo "VER=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_ENV"
      - name: Tests de l'application
        run: cargo test -p nightfall
      - name: Compilation et empaquetage (CEF inclus)
        id: pkg
        run: cargo xtask package
      - name: Archive portable et installateur Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Icon of nightfall.exe (CEF's bootstrap launcher): rcedit (MIT, free).
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile "$env:RUNNER_TEMP\rcedit.exe"
          & "$env:RUNNER_TEMP\rcedit.exe" "dist\NIGHTFALL\nightfall.exe" --set-icon "app\resources\win\nightfall.ico" --set-version-string "ProductName" "NIGHTFALL" --set-version-string "FileDescription" "NIGHTFALL Browser"
          if ($LASTEXITCODE -ne 0) { Write-Error "rcedit a échoué"; exit 1 }
          Compress-Archive -Path dist/NIGHTFALL -DestinationPath "dist/NIGHTFALL-$env:VER-windows-x64-portable.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VER" packaging\windows\nightfall.iss
      - name: Test de démarrage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NIGHTFALL_PROFILE_DIR = "$env:RUNNER_TEMP\nf-profile"
          $p = Start-Process -FilePath "dist\NIGHTFALL\nightfall.exe" -PassThru
          Start-Sleep -Seconds 25
          $logs = "$env:NIGHTFALL_PROFILE_DIR\logs"
          # Screenshot of what the user sees, printed in the log (base64).
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $sb = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $sb.Width, $sb.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($sb.Location, [System.Drawing.Point]::Empty, $sb.Size)
          $small = New-Object System.Drawing.Bitmap $bmp, 960, ([int](960 * $sb.Height / $sb.Width))
          $small.Save("$env:RUNNER_TEMP\shot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Output "NFSHOT-BEGIN"; [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:RUNNER_TEMP\shot.png")); Write-Output "NFSHOT-END"
          python -m pip install --quiet pillow
          python ci/check_shot.py "$env:RUNNER_TEMP\shot.png"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($p.HasExited) { Get-ChildItem -Recurse $env:NIGHTFALL_PROFILE_DIR -ErrorAction SilentlyContinue | Select-Object FullName; Get-Content "$logs\nightfall.log","$logs\chromium.log" -ErrorAction SilentlyContinue; Write-Error "NIGHTFALL s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Get-Process | Where-Object { $_.Path -like "*NIGHTFALL*" } | Select-Object Id, ProcessName, @{n='RAM_Mo';e={[math]::Round($_.WorkingSet64/1MB)}} | Format-Table
          if (!(Test-Path "$env:NIGHTFALL_PROFILE_DIR\chromium")) { Write-Error "profil Chromium non créé"; exit 1 }
          Get-Content "$env:NIGHTFALL_PROFILE_DIR\logs\nightfall.log"
          if (!(Select-String -Path "$env:NIGHTFALL_PROFILE_DIR\logs\nightfall.log" -Pattern "interface prête" -Quiet)) { Get-Content "$logs\chromium.log" -ErrorAction SilentlyContinue | Select-Object -Last 60; Write-Error "l'interface NIGHTFALL ne s'est pas chargée"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Get-Process | Where-Object { $_.Path -like "*NIGHTFALL*" } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Test de démarrage (macOS)
        if: runner.os == 'macOS'
        run: |
          export NIGHTFALL_PROFILE_DIR="$RUNNER_TEMP/nf-profile"
          ./dist/NIGHTFALL.app/Contents/MacOS/nightfall > "$RUNNER_TEMP/nf.log" 2>&1 &
          PID=$!
          sleep 25
          if ! kill -0 $PID 2>/dev/null; then echo "NIGHTFALL s'est arrêté"; cat "$RUNNER_TEMP/nf.log"; exit 1; fi
          ps -axo pid,rss,comm | grep -i nightfall || true
          screencapture -x "$RUNNER_TEMP/shot.png" && sips -Z 960 "$RUNNER_TEMP/shot.png" >/dev/null && { echo NFSHOT-BEGIN; base64 -i "$RUNNER_TEMP/shot.png" | tr -d '\n'; echo; echo NFSHOT-END; } || echo "capture d'écran impossible"
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 ci/check_shot.py "$RUNNER_TEMP/shot.png"
          test -d "$NIGHTFALL_PROFILE_DIR/chromium" || { echo "profil Chromium non créé"; cat "$RUNNER_TEMP/nf.log"; exit 1; }
          cat "$NIGHTFALL_PROFILE_DIR/logs/nightfall.log"
          grep -q "interface prête" "$NIGHTFALL_PROFILE_DIR/logs/nightfall.log" || { echo "l'interface NIGHTFALL ne s'est pas chargée"; tail -n 80 "$RUNNER_TEMP/nf.log"; tail -n 80 "$NIGHTFALL_PROFILE_DIR/logs/chromium.log" 2>/dev/null; exit 1; }
          kill $PID; sleep 3; pkill -f NIGHTFALL.app || true
          tail -n 40 "$RUNNER_TEMP/nf.log"
      - name: Auto-test de bout en bout (navigateur réel)
        if: always() && steps.pkg.outcome == 'success'
        shell: bash
        env:
          NIGHTFALL_FEATURES: selftest
          NIGHTFALL_DIST_DIR: ${{ runner.temp }}/selftest-dist
          NIGHTFALL_SELFTEST: "1"
        run: |
          cargo xtask bundle
          export NIGHTFALL_PROFILE_DIR="$RUNNER_TEMP/nf-selftest-profile"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$NIGHTFALL_DIST_DIR/NIGHTFALL/nightfall.exe"
          else
            BIN="$NIGHTFALL_DIST_DIR/NIGHTFALL.app/Contents/MacOS/nightfall"
          fi
          "$BIN" > "$RUNNER_TEMP/selftest.out" 2>&1 &
          PID=$!
          LOG="$NIGHTFALL_PROFILE_DIR/logs/nightfall.log"
          for i in $(seq 1 120); do
            if [ -f "$LOG" ] && grep -qE "SELFTEST (OK|FAIL)" "$LOG"; then break; fi
            sleep 2
          done
          sleep 3
          kill $PID 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM nightfall.exe > /dev/null 2>&1 || true; else pkill -f selftest-dist || true; fi
          cat "$LOG" || true
          echo "--- sortie du processus ---"; tail -n 40 "$RUNNER_TEMP/selftest.out" || true
          echo "--- journal Chromium (réseau) ---"; grep -iE "net|dns|proxy|socket|sandbox|error" "$NIGHTFALL_PROFILE_DIR/logs/chromium.log" | tail -n 60 || true
          echo "--- journal Chromium (fin) ---"; ls -la "$NIGHTFALL_PROFILE_DIR/logs" || true; tail -n 30 "$NIGHTFALL_PROFILE_DIR/logs/chromium.log" 2>/dev/null || true
          echo "--- requêtes vers example.com (netlog) ---"; python3 ci/netlog_summary.py "$NIGHTFALL_PROFILE_DIR/logs/netlog.json" 2>&1 | head -n 160 || true
          grep -o '"net_error":-[0-9]*' "$NIGHTFALL_PROFILE_DIR/logs/netlog.json" 2>/dev/null | sort | uniq -c || true
          grep -oE '"(host|url)":"[^"]*example[^"]*"' "$NIGHTFALL_PROFILE_DIR/logs/netlog.json" 2>/dev/null | sort | uniq -c | head || true
          echo "--- réseau de la machine ---"; curl -sS -o /dev/null -w "curl http://example.com -> %{http_code}\n" http://example.com || true
          if [ "$RUNNER_OS" = "macOS" ]; then scutil --proxy || true; scutil --dns | head -n 30 || true; fi
          grep -q "SELFTEST OK" "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: NIGHTFALL-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  # Published from the main branch, once per version number, and only once
  # every check above has passed (tests, start-up test, end-to-end self
  # test, security checks). The version tag is created by the release.
  release:
    name: Publication (pré-version)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, app, security-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Version déjà publiée ?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" > /dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; echo "déjà publiée"; fi
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.yes != '1'
        with:
          path: out
          pattern: NIGHTFALL-*
          merge-multiple: true
      - name: Sommes de contrôle SHA-256
        if: steps.exists.outputs.yes != '1'
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Pré-version GitHub
        if: steps.exists.outputs.yes != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "NIGHTFALL ${{ steps.ver.outputs.tag }} (pré-version)" \
            --notes-file docs/RELEASE_NOTES.md

  security-checks:
    name: Contrôles de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aucun commutateur Chromium affaiblissant dans le code de NIGHTFALL
        run: |
          set -e
          # The forbidden list itself lives in crates/nf-security/src/switches.rs.
          if grep -rnE '"(no-sandbox|disable-web-security|remote-debugging-port|disable-site-isolation-trials|ignore-certificate-errors)"' app/src --include=*.rs; then
            echo "Un commutateur interdit est utilisé dans app/src" >&2
            exit 1
          fi
      - name: Aucun secret dans le dépôt
        run: |
          set -e
          if git ls-files | grep -E '\.(pem|p12|pfx|key|secret)$'; then
            echo "Fichier de secret détecté" >&2
            exit 1
          fi
      - name: Le moteur de clé logiciel de CI n'est jamais activé par défaut
        run: |
          set -e
          # Only the "selftest" feature (CI end-to-end test, never packaged) may enable it.
          if grep -n "insecure-software-backend-for-ci" app/Cargo.toml | grep -v "^[0-9]*:selftest = "; then
            echo "insecure-software-backend-for-ci activé hors selftest" >&2; exit 1
          fi
          if grep -nE '^default *=.*selftest' app/Cargo.toml; then echo "selftest activé par défaut" >&2; exit 1; fi
          if grep -n "NIGHTFALL_FEATURES" .github/workflows/ci.yml | grep -v "NIGHTFALL_FEATURES: selftest" | grep -v "grep"; then
            echo "fonctionnalités de compilation détournées hors auto-test" >&2; exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
