# Tâche 5, étape 1 : la signature EVS (Widevine/VMP) fonctionne-t-elle sur macOS
# avec une signature Apple ad hoc ? Une vidéo Widevine de démonstration (Shaka
# Player) doit se lire dans le paquet signé. Rien n'est publié ni distribué.
name: Lecteur compagnon - preuve macOS

on:
  push:
    branches: [poc-ecs-evs-macos]
  workflow_dispatch:

permissions:
  contents: read

env:
  ECS_VERSION: 45.2.1
  SHAKA_VERSION: 5.3.4
  EVS_VERSION: 1.3.3

jobs:
  macos:
    name: ECS + EVS + signature ad hoc (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Outils (castlabs-evs, Shaka Player)
        run: |
          python3 -m pip install --quiet "castlabs-evs==$EVS_VERSION"
          mkdir -p "$RUNNER_TEMP/shaka" && cd "$RUNNER_TEMP/shaka"
          npm pack --silent "shaka-player@$SHAKA_VERSION"
          tar -xzf "shaka-player-$SHAKA_VERSION.tgz"
          cp package/dist/shaka-player.compiled.js "$GITHUB_WORKSPACE/tools/ecs-poc/"

      - name: Electron for Content Security (téléchargement vérifié)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/castlabs/electron-releases/releases/download/v$ECS_VERSION%2Bwvcus"
          zip="electron-v$ECS_VERSION+wvcus-darwin-arm64.zip"
          curl -sSLf -o "$zip" "$base/$zip"
          curl -sSLf -o SHASUMS256.txt "$base/SHASUMS256.txt"
          grep -F " *$zip" SHASUMS256.txt | sed 's/ \*/  /' | shasum -a 256 -c -
          mkdir ecs && ditto -x -k "$zip" ecs
          ls ecs

      - name: Témoin - ECS tel que publié (signature VMP de développement)
        continue-on-error: true
        env:
          ECS_POC_OUT: ${{ runner.temp }}/out
          ECS_POC_LABEL: temoin-developpement
        run: |
          "$RUNNER_TEMP/ecs/Electron.app/Contents/MacOS/Electron" "$GITHUB_WORKSPACE/tools/ecs-poc" 2>&1 | tail -40

      - name: Paquet de test (application dans Resources/app)
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          ditto "$RUNNER_TEMP/ecs/Electron.app" "$RUNNER_TEMP/pkg/Electron.app"
          ditto "$GITHUB_WORKSPACE/tools/ecs-poc" "$RUNNER_TEMP/pkg/Electron.app/Contents/Resources/app"
          rm -f "$RUNNER_TEMP/pkg/Electron.app/Contents/Resources/app/evs_login.py"
          xattr -cr "$RUNNER_TEMP/pkg/Electron.app"

      - name: Connexion EVS (secrets, non interactive)
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
        run: python3 tools/ecs-poc/evs_login.py

      - name: Signature VMP de production (EVS), avant la signature Apple
        env:
          EVS_NO_ASK: '1'
        run: python3 -m castlabs_evs.vmp sign-pkg "$RUNNER_TEMP/pkg"

      - name: Signature Apple ad hoc
        run: |
          codesign --force --deep --sign - "$RUNNER_TEMP/pkg/Electron.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/pkg/Electron.app"
          codesign -dv "$RUNNER_TEMP/pkg/Electron.app" 2>&1 | grep -E "Signature|TeamIdentifier|flags"

      - name: Vérification de la signature VMP après la signature Apple
        env:
          EVS_NO_ASK: '1'
        run: python3 -m castlabs_evs.vmp verify-pkg "$RUNNER_TEMP/pkg"

      - name: Lecture Widevine dans le paquet signé (EVS + ad hoc)
        env:
          ECS_POC_OUT: ${{ runner.temp }}/out
          ECS_POC_LABEL: evs-adhoc
        run: |
          "$RUNNER_TEMP/pkg/Electron.app/Contents/MacOS/Electron" 2>&1 | tail -40
          exit "${PIPESTATUS[0]}"

      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecs-poc-captures
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
