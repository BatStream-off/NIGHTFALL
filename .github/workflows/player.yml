# Lecteur NIGHTFALL (sites vidéo protégés) : construction, signature VMP de
# production (castLabs EVS), signature Apple ad hoc (macOS), auto-test dans le
# paquet signé, manifeste signé Ed25519.
#
# Clé Ed25519 : sur les branches et les PR, signature avec une clé JETABLE créée
# pour l'exécution. La vraie clé de mise à jour (NIGHTFALL_UPDATE_KEY) ne sert
# qu'à la publication, depuis main, et seulement quand la version du lecteur
# (player/package.json) n'est pas encore publiée : publication « lecteur-v<version> »,
# jamais marquée comme dernière version de NIGHTFALL.
name: Lecteur NIGHTFALL

on:
  push:
    branches: [main, poc-ecs-evs-macos]
  pull_request:
    paths: ['player/**', '.github/workflows/player.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-${{ github.ref }}
  cancel-in-progress: true

env:
  ECS_VERSION: 45.2.1+wvcus
  SHAKA_VERSION: 5.3.4
  EVS_VERSION: 1.3.3

jobs:
  plan:
    name: Version du lecteur
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./player/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false; build=true
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            if gh release view "lecteur-v$version" -R "${{ github.repository }}" > /dev/null 2>&1; then
              echo "lecteur-v$version déjà publié : rien à faire"; build=false
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Lecteur (${{ matrix.key }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, key: macos-arm64, zip: darwin-arm64 }
          - { os: windows-latest, key: windows-x64, zip: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NF_PLAYER_OUT: ${{ github.workspace }}/out
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version
        id: v
        run: echo "player=$(node -p "require('./player/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Outils (castlabs-evs, packager, fuses, Shaka Player pour l'auto-test)
        run: |
          python -m pip install --quiet "castlabs-evs==$EVS_VERSION"
          npm install --prefix player/build --no-audit --no-fund --silent @electron/packager@20.3.0 @electron/fuses@2.1.3
          mkdir -p "$RUNNER_TEMP/shaka" && cd "$RUNNER_TEMP/shaka"
          npm pack --silent "shaka-player@$SHAKA_VERSION"
          tar -xzf "shaka-player-$SHAKA_VERSION.tgz"
          cp package/dist/shaka-player.compiled.js "$GITHUB_WORKSPACE/player/selftest/"

      - name: Electron for Content Security (téléchargement vérifié)
        run: |
          mkdir -p "$RUNNER_TEMP/ecszip" && cd "$RUNNER_TEMP/ecszip"
          base="https://github.com/castlabs/electron-releases/releases/download/v${ECS_VERSION/+/%2B}"
          zip="electron-v$ECS_VERSION-${{ matrix.zip }}.zip"
          curl -sSLf -o "$zip" "$base/$zip"
          curl -sSLf -o ../SHASUMS256.txt "$base/SHASUMS256.txt"
          expected=$(grep -F " *$zip" ../SHASUMS256.txt | cut -d' ' -f1)
          actual=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$zip")
          echo "$zip : $actual"
          test -n "$expected" && test "$expected" = "$actual"

      - name: Paquet et fuses
        run: |
          node player/build/package.mjs "$RUNNER_TEMP/ecszip" "$ECS_VERSION" "$RUNNER_TEMP/pkg"
          ls "$RUNNER_TEMP/pkg"/*
          echo "PKG=$(ls -d "$RUNNER_TEMP/pkg"/*/ | head -1)" >> "$GITHUB_ENV"

      - name: Connexion EVS (secrets, non interactive)
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_NO_ASK: '1'
        run: python player/build/evs_login.py

      - name: Signature VMP de production (EVS)
        env:
          EVS_NO_ASK: '1'
        run: python -m castlabs_evs.vmp sign-pkg "$PKG"

      # Seulement si EVS refuse le paquet macOS : quelle modification est en cause ?
      #   A = ECS d'origine + fuses seules ; B = renommé par le packager (sans empreinte
      #   dans le framework), sans fuses.
      - name: Diagnostic EVS macOS (si refus)
        if: failure() && runner.os == 'macOS'
        env:
          EVS_NO_ASK: '1'
        run: |
          set +e
          cd "$RUNNER_TEMP"
          mkdir -p diagA diagB/src
          ditto -x -k "ecszip/electron-v$ECS_VERSION-${{ matrix.zip }}.zip" diagA
          node --input-type=module -e "
            import { flipFuses, FuseVersion, FuseV1Options as F } from '$GITHUB_WORKSPACE/player/build/node_modules/@electron/fuses/dist/index.js';
            await flipFuses('diagA/Electron.app', { version: FuseVersion.V1, resetAdHocDarwinSignature: false,
              [F.RunAsNode]: false, [F.EnableCookieEncryption]: true, [F.EnableNodeOptionsEnvironmentVariable]: false,
              [F.EnableNodeCliInspectArguments]: false, [F.EnableEmbeddedAsarIntegrityValidation]: true,
              [F.OnlyLoadAppFromAsar]: true, [F.LoadBrowserProcessSpecificV8Snapshot]: false, [F.GrantFileProtocolExtraPrivileges]: true });"
          echo "=== A : ECS d'origine + fuses seules"; python -m castlabs_evs.vmp sign-pkg diagA 2>&1 | tail -3
          cp -R "$GITHUB_WORKSPACE/player/." diagB/src/ && rm -rf diagB/src/build
          node --input-type=module -e "
            import { packager } from '$GITHUB_WORKSPACE/player/build/node_modules/@electron/packager/dist/index.js';
            await packager({ dir: 'diagB/src', out: 'diagB/out', platform: 'darwin', arch: 'arm64', name: 'Lecteur NIGHTFALL',
              electronVersion: '$ECS_VERSION', electronZipDir: '$RUNNER_TEMP/ecszip', asar: true, asarIntegrityDigest: false, prune: false });"
          echo "=== B : renommé par le packager, sans empreinte ni fuses"; python -m castlabs_evs.vmp sign-pkg diagB/out/*/ 2>&1 | tail -3
          exit 1

      - name: Signature Apple ad hoc (après EVS)
        if: runner.os == 'macOS'
        run: |
          app="$PKG/Lecteur NIGHTFALL.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "^Signature|TeamIdentifier|flags"

      - name: Vérifications (VMP, fuses)
        env:
          EVS_NO_ASK: '1'
        run: |
          python -m castlabs_evs.vmp verify-pkg "$PKG"
          if [ "$RUNNER_OS" = macOS ]; then app="$PKG/Lecteur NIGHTFALL.app"; else app="$PKG/Lecteur NIGHTFALL.exe"; fi
          npx --prefix player/build electron-fuses read --app "$app"

      - name: Auto-test dans le paquet signé (Widevine, verrouillage, mémoire)
        run: |
          if [ "$RUNNER_OS" = macOS ]; then bin="$PKG/Lecteur NIGHTFALL.app/Contents/MacOS/Lecteur NIGHTFALL"; else bin="$PKG/Lecteur NIGHTFALL.exe"; fi
          set +e
          "$bin" --nf-selftest --enable-logging=stderr > "$RUNNER_TEMP/selftest.log" 2>&1 &
          pid=$!
          for i in $(seq 1 150); do [ -f "$NF_PLAYER_OUT"/selftest-*.json ] && break; sleep 1; done
          if [ ! -f "$NF_PLAYER_OUT"/selftest-*.json ] && [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$i=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; [System.Drawing.Graphics]::FromImage(\$i).CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$i.Save('$NF_PLAYER_OUT\\ecran-windows.png')" || true
            tasklist | grep -i -E "lecteur|electron" || true
          fi
          sleep 3; kill $pid 2>/dev/null
          echo "--- trace"; cat "$NF_PLAYER_OUT"/trace-*.txt 2>/dev/null
          echo "--- journal (fin)"; grep -v -i "passw" "$RUNNER_TEMP/selftest.log" | tail -40
          echo "--- résultat"; cat "$NF_PLAYER_OUT"/selftest-*.json
          python -c "import json,glob,sys;r=json.load(open(glob.glob(sys.argv[1]+'/selftest-*.json')[0]));print('mémoire (Mo) :',round(r['memoryKB']/1024),'processus :',r['processes']);sys.exit(0 if r['ok'] else 1)" "$NF_PLAYER_OUT"

      - name: Archive et taille sur disque
        run: |
          name="Lecteur-NIGHTFALL-${{ steps.v.outputs.player }}-${{ matrix.key }}.zip"
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent "$PKG/Lecteur NIGHTFALL.app" "dist/$name"
          else
            (cd "$PKG" && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/$name" . > /dev/null)
          fi
          python -c "import os,sys
          def du(p): return sum(os.path.getsize(os.path.join(d,f)) for d,_,fs in os.walk(p) for f in fs if not os.path.islink(os.path.join(d,f)))
          print('installé (Mo) :', round(du(sys.argv[1])/2**20,1), '| téléchargement (Mo) :', round(os.path.getsize(sys.argv[2])/2**20,1))" "$PKG" "dist/$name" | tee "$NF_PLAYER_OUT/taille-${{ matrix.key }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: lecteur-${{ matrix.key }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lecteur-test-${{ matrix.key }}
          path: out
          if-no-files-found: warn

  manifest:
    name: Manifeste signé
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lecteur-*
          path: dist
          merge-multiple: true
      - name: Signer puis vérifier
        env:
          RELEASE_KEY: ${{ needs.plan.outputs.publish == 'true' && secrets.NIGHTFALL_UPDATE_KEY || '' }}
        run: |
          python3 -m pip install --quiet cryptography
          version="${{ needs.plan.outputs.version }}"
          if [ "${{ needs.plan.outputs.publish }}" = true ]; then
            # Publication : vraie clé, vérifiée contre la clé publique compilée dans NIGHTFALL.
            test -n "$RELEASE_KEY" || { echo "NIGHTFALL_UPDATE_KEY absent"; exit 1; }
            export NF_PLAYER_SIGNING_KEY="$RELEASE_KEY"
            PUB=$(grep -m1 'pub const PUBLIC_KEY_B64' crates/nf-update/src/lib.rs | cut -d'"' -f2)
          else
            eval "$(python3 -c "
          import base64
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization as s
          k = Ed25519PrivateKey.generate()
          raw = lambda b: base64.b64encode(b).decode()
          print('export NF_PLAYER_SIGNING_KEY=' + raw(k.private_bytes(s.Encoding.Raw, s.PrivateFormat.Raw, s.NoEncryption())))
          print('PUB=' + raw(k.public_key().public_bytes(s.Encoding.Raw, s.PublicFormat.Raw)))
          ")"
            echo "::add-mask::$NF_PLAYER_SIGNING_KEY"
          fi
          ECS_VERSION="$ECS_VERSION" python3 player/build/manifest.py "$version" dist
          unset NF_PLAYER_SIGNING_KEY RELEASE_KEY
          python3 player/build/manifest.py --verify dist "$PUB"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: lecteur-manifeste
          path: dist/player.json*

  release:
    name: Publication du lecteur
    needs: [plan, manifest]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lecteur-*
          path: dist
          merge-multiple: true
      - name: Publication lecteur-v${{ needs.plan.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.plan.outputs.version }}"
          cd dist && rm -f *.png *.json.part selftest-* trace-* taille-* && ls -la
          gh release create "lecteur-v$v" Lecteur-NIGHTFALL-*.zip player.json player.json.sig \
            -R "${{ github.repository }}" --target "$GITHUB_SHA" --latest=false \
            --title "Lecteur NIGHTFALL $v" \
            --notes "Lecteur NIGHTFALL $v pour les sites vidéo protégés (Widevine), basé sur Electron for Content Security $ECS_VERSION de castLabs (MIT). Téléchargé et vérifié par NIGHTFALL (manifeste signé, SHA-256) seulement après l'accord de l'utilisateur ; ne pas l'installer à la main."
