<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Mots de passe · NIGHTFALL</title>
  <link rel="stylesheet" href="nf.css">
  
</head>
<body>
  <div class="page">
    <div class="page-head"><img src="emblem.svg" alt=""><div><h1>Mots de passe</h1><div class="muted">Coffre-fort chiffré localement (XChaCha20-Poly1305)</div></div></div>
    <div class="card">
      <div class="row"><input id="q" class="grow" placeholder="Rechercher"><button id="new" class="primary">Ajouter</button></div>
      <div id="form" hidden style="margin-top:12px">
        <div class="row"><input id="f-origin" class="grow" placeholder="https://site.exemple"><input id="f-user" class="grow" placeholder="Identifiant"></div>
        <div class="row" style="margin-top:8px"><input id="f-pass" class="grow" type="password" placeholder="Mot de passe"><button id="f-gen">Générer</button><input id="f-notes" class="grow" placeholder="Notes"><button id="f-save" class="primary">Enregistrer</button></div>
      </div>
    </div>
    <div class="card"><ul id="list" class="list"></ul></div>
  </div>
  <script src="nf.js"></script>
  <script src="passwords.js"></script>
</body>
</html>
