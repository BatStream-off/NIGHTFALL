<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Historique · NIGHTFALL</title>
  <link rel="stylesheet" href="nf.css">
  
</head>
<body>
  <div class="page">
    <div class="page-head"><img src="emblem.svg" alt=""><div><h1>Historique</h1><div class="muted">Pages visitées (hors navigation privée), chiffré sur cet appareil</div></div></div>
    <div class="card">
      <div class="row"><input id="q" class="grow" placeholder="Rechercher dans l'historique"><label class="muted">Du</label><input id="from" type="date" style="width:auto"><label class="muted">au</label><input id="to" type="date" style="width:auto"></div>
      <div class="row" style="margin-top:10px"><button id="del-hour">Effacer la dernière heure</button><button id="del-day">Effacer les dernières 24 h</button><button id="del-all" class="danger">Tout effacer</button></div>
    </div>
    <div class="card"><ul id="list" class="list"></ul></div>
  </div>
  <script src="nf.js"></script>
  <script src="history.js"></script>
</body>
</html>
