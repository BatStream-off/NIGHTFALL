<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.png">
  <title>Nouvel onglet</title>
  <link rel="stylesheet" href="nf.css">
  <style>
    html, body { height: 100%; }
    body {
      --glass: rgba(9, 13, 24, .74);
      --glass-strong: rgba(14, 19, 32, .88);
      --glass-line: rgba(190, 215, 255, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .55);
      --tile: 72px;
      overflow: hidden; background: var(--night);
    }

    /* ---- Background: wallpaper, plain colour or the user's image */
    .wall { position: fixed; inset: -24px; z-index: 0; background: var(--night) center / cover no-repeat; opacity: 0; transition: opacity .6s ease; }
    .wall.on { opacity: 1; }
    .scrim { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: rgba(3, 5, 10, var(--dim, 0));
      box-shadow: inset 0 140px 120px -100px rgba(3, 5, 10, .45), inset 0 -140px 120px -100px rgba(3, 5, 10, .45); }

    /* ---- Nine places for the widgets */
    .stage { position: fixed; inset: 0; z-index: 1; }
    .cell { position: absolute; display: flex; flex-direction: column; gap: 16px; width: max-content; max-width: calc(100vw - 48px); }
    .cell[data-pos^="t"] { top: 24px; }
    .cell[data-pos^="m"] { top: 50%; transform: translateY(-50%); }
    .cell[data-pos^="b"] { bottom: 40px; }
    .cell[data-pos$="l"] { left: 24px; align-items: flex-start; }
    .cell[data-pos$="c"] { left: 50%; transform: translateX(-50%); align-items: center; }
    .cell[data-pos="mc"] { transform: translate(-50%, -50%); }
    .cell[data-pos$="r"] { right: 24px; align-items: flex-end; }
    .cell[data-pos="tr"] { right: 80px; }
    /* Top centre: leaves room for the top corners (clock, settings button). */
    .cell[data-pos="tc"] { max-width: calc(100vw - 340px); }
    .widget { position: relative; max-width: 100%; }
    .widget[hidden] { display: none; }

    /* ---- Clock */
    .clock { text-align: inherit; color: #f2f6ff; text-shadow: var(--shadow); padding: 4px; }
    .cell[data-pos$="c"] .clock { text-align: center; }
    .cell[data-pos$="r"] .clock { text-align: right; }
    .clock .time { font: 500 var(--clock-size, 26px)/1 var(--display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
    .clock .date { margin-top: 6px; font-size: calc(var(--clock-size, 26px) * .34 + 6px); color: rgba(236, 242, 255, .82); }
    .clock.style-light .time { font-weight: 300; font-family: var(--ui); letter-spacing: -.01em; }
    .clock.style-bold .time { font-weight: 600; }

    /* ---- Settings button (always top right) */
    .gear { position: fixed; z-index: 5; top: 24px; right: 24px; width: 40px; height: 40px; padding: 0; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); color: #e8eefc; }
    .gear:hover, .gear[aria-expanded="true"] { background: var(--glass-strong); border-color: rgba(190, 215, 255, .24); }
    .gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--ease); }
    .gear[aria-expanded="true"] svg { transform: rotate(60deg); }

    /* ---- Shortcuts */
    .tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; list-style: none; margin: 0; padding: 0; min-height: 1px; max-width: calc((var(--tile) + 28px) * var(--per-row, 8)); }
    .cell[data-pos$="l"] .tiles { justify-content: flex-start; }
    .cell[data-pos$="r"] .tiles { justify-content: flex-end; }
    .tile { position: relative; width: calc(var(--tile) + 20px); }
    .tile > a, .tile > button.add {
      display: grid; justify-items: center; gap: 8px; width: 100%; height: auto; padding: 6px 0 4px; border: 0; border-radius: 14px;
      background: transparent; color: #eef3ff; text-decoration: none; font: inherit;
    }
    .tile > a:hover, .tile > button.add:hover { text-decoration: none; background: transparent; }
    .tile .sq {
      width: var(--tile); height: var(--tile); border-radius: calc(var(--tile) / 4); display: grid; place-items: center;
      background: var(--glass); border: 1px solid var(--glass-line);
      transition: background .15s var(--ease), border-color .15s var(--ease);
    }
    .tiles.square .tile .sq { border-radius: 10px; }
    .tiles.round .tile .sq { border-radius: 50%; }
    .tile:hover .sq, .tile:focus-within .sq { background: var(--glass-strong); border-color: rgba(190, 215, 255, .26); }
    .tile .ini { width: 56%; height: 56%; border-radius: 28%; display: grid; place-items: center; font: 500 calc(var(--tile) * .28)/1 var(--display); color: #eef3ff; background: rgba(190, 215, 255, .10); }
    .tile .nm { max-width: 100%; font-size: 13px; line-height: 1.25; color: #eef3ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: var(--shadow); }
    .tiles.no-names .tile .nm { display: none; }
    .tile > a:focus-visible, .tile > button.add:focus-visible { box-shadow: none; }
    .tile > a:focus-visible .sq, .tile > button.add:focus-visible .sq { box-shadow: var(--focus); }
    .tile .add-ic { width: 26px; height: 26px; fill: none; stroke: #dfe8fb; stroke-width: 1.6; stroke-linecap: round; }
    .tile .rm {
      position: absolute; top: 0; right: 4px; width: 22px; height: 22px; padding: 0; border-radius: 50%;
      background: #1a2338; border: 1px solid rgba(190, 215, 255, .22); color: #dfe8fb; opacity: 0; transition: opacity .12s;
    }
    .tile .rm svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .tile:hover .rm, .tile:focus-within .rm { opacity: 1; }
    .tile .rm:hover { background: #2a3654; color: #fff; }

    /* ---- Search */
    .search { position: relative; width: var(--search-w, min(620px, 90vw)); max-width: 90vw; }
    .search svg { position: absolute; z-index: 1; left: 20px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: none; stroke: #c3cee4; stroke-width: 1.6; stroke-linecap: round; pointer-events: none; }
    .search input {
      height: 54px; font-size: 16px; padding: 0 22px 0 54px; border-radius: 27px; color: #f4f7ff;
      background: rgba(9, 13, 24, .78); border: 1px solid rgba(190, 215, 255, .16); transition: border-color .15s, background .15s;
    }
    .search input::placeholder { color: #9aa7c2; }
    .search input:hover { border-color: rgba(190, 215, 255, .26); background: rgba(12, 17, 30, .84); }
    .search input:focus-visible { border-color: rgba(220, 230, 250, .42); background: rgba(12, 17, 30, .9); box-shadow: none; }

    /* ---- Stats */
    .stats { padding: 16px 24px 20px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); }
    .stats h2 { font: 500 13px var(--ui); color: #c9d3e6; margin: 0 0 12px; letter-spacing: 0; display: flex; align-items: center; gap: 8px; }
    .stats h2 img { width: 16px; height: 16px; }
    .stats dl { display: flex; gap: 36px; margin: 0; }
    .stats dl > div { display: grid; gap: 4px; }
    .stats dd { order: -1; margin: 0; display: flex; align-items: baseline; gap: 6px; font: 500 40px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: 0; color: #f2f6ff; }
    .stats dd small { font: 500 15px var(--ui); color: #c9d3e6; }
    .stats dt { font-size: 13px; color: #aeb9cf; line-height: 1.3; white-space: nowrap; }
    .stats.compact { padding: 10px 16px; border-radius: 12px; }
    .stats.compact h2 { display: none; }
    .stats.compact dl { gap: 20px; }
    .stats.compact dd { font-size: 20px; }
    .stats.compact dd small { font-size: 12px; }
    .stats.compact dt { font-size: 12px; }

    /* ---- Arranging: drag a widget onto one of the nine places */
    body.arranging .widget { outline: 1px dashed rgba(220, 230, 250, .55); outline-offset: 6px; border-radius: 12px; cursor: grab; }
    body.arranging .widget > * { pointer-events: none; }
    body.arranging .widget.dragging { opacity: .45; }
    .drop-zones { position: fixed; inset: 0; z-index: 3; display: none; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 12px; padding: 16px; pointer-events: none; }
    body.dragging-widget .drop-zones { display: grid; }
    .drop-zones div { border: 1px dashed rgba(220, 230, 250, .28); border-radius: 16px; background: rgba(9, 13, 24, .18); pointer-events: auto; }
    .drop-zones div.over { background: rgba(120, 170, 255, .18); border-color: rgba(220, 230, 250, .7); }
    .arrange-bar { position: fixed; z-index: 6; left: 50%; bottom: 24px; transform: translateX(-50%); display: none; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 14px; background: rgba(10, 14, 26, .94); border: 1px solid rgba(190, 215, 255, .16); font-size: 14px; color: var(--moon); box-shadow: 0 16px 40px rgba(0, 0, 0, .5); }
    body.arranging .arrange-bar { display: flex; }

    /* ---- Popovers (add shortcut, customize) */
    .pop {
      position: absolute; z-index: 10; background: rgba(10, 14, 26, .96); border: 1px solid rgba(190, 215, 255, .14);
      border-radius: 14px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
      animation: pop-in .18s var(--ease);
    }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } }
    .pop h2 { font: 500 15px var(--ui); margin: 0 0 4px; letter-spacing: 0; }
    .pop h3 { font: 500 13px var(--ui); color: var(--mist); margin: 20px 0 8px; letter-spacing: 0; }
    .addform { width: 320px; padding: 20px; }
    .addform label { margin: 12px 0 6px; }
    .addform .err { color: var(--danger); font-size: 13px; margin: 8px 0 0; min-height: 0; }
    .addform .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .addform button.primary { clip-path: none; border-radius: 8px; }

    .custom { position: fixed; right: 24px; top: 72px; width: 360px; padding: 20px 20px 16px; max-height: calc(100vh - 90px); overflow: auto; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(255, 255, 255, .05); margin-bottom: 12px; }
    .seg button { height: 32px; border: 0; border-radius: 6px; background: transparent; color: #c9d3e6; font-size: 13px; font-weight: 400; padding: 0 8px; }
    .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .12); color: #fff; }
    .walls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .walls button { display: grid; gap: 4px; height: auto; padding: 0; border: 0; background: transparent; text-align: left; font: 12px var(--ui); color: #c9d3e6; }
    .walls button:hover { background: transparent; color: #fff; }
    .walls img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; border: 1px solid rgba(190, 215, 255, .12); }
    .walls button[aria-pressed="true"] img { border-color: transparent; box-shadow: 0 0 0 2px var(--arc); }
    .walls button[aria-pressed="true"] { color: #fff; }
    .walls button:focus-visible { box-shadow: none; }
    .walls button:focus-visible img { box-shadow: var(--focus); }
    .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .swatches button { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .18); }
    .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--arc); }
    .swatches input[type=color] { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .18); background: none; cursor: pointer; }
    .img-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .img-pick img { width: 96px; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; border: 1px solid rgba(190, 215, 255, .12); }
    .range { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 10px; font-size: 13px; color: #c9d3e6; margin: 8px 0; }
    .range input { padding: 0; height: auto; accent-color: var(--arc); background: none; border: 0; }
    .range output { text-align: right; font-variant-numeric: tabular-nums; color: #aeb9cf; }
    .wopt { border-top: 1px solid rgba(190, 215, 255, .08); padding: 8px 0; }
    .wopt > .head { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; color: var(--moon); }
    .wopt > .head .grow { flex: 1; }
    .wopt select { height: 30px; width: auto; font-size: 13px; padding: 0 28px 0 8px; }
    .wopt .more { display: grid; gap: 6px; padding: 4px 0 4px 0; }
    .wopt .more[hidden] { display: none; }
    .wopt .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: #c9d3e6; min-height: 32px; }
    .custom input[type=checkbox].tg { width: 36px; height: 20px; appearance: none; background: var(--steel-2); border-radius: 99px; position: relative; cursor: pointer; border: 0; padding: 0; flex: none; transition: background .15s; }
    .custom input[type=checkbox].tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--c-text); transition: transform .15s; }
    .custom input[type=checkbox].tg:checked { background: var(--hex); }
    .custom input[type=checkbox].tg:checked::after { transform: translateX(16px); background: #fff; }
    .custom .actions-row { display: flex; gap: 8px; margin-top: 12px; }
    .custom .actions-row button { flex: 1; height: 34px; font-size: 13px; }
    .custom .links { display: grid; gap: 2px; margin-top: 16px; padding-top: 8px; border-top: 1px solid rgba(190, 215, 255, .08); }
    .custom .links button { justify-content: flex-start; height: 38px; gap: 12px; padding: 0 10px; margin: 0 -8px; background: transparent; border-color: transparent; font-weight: 400; }
    .custom .links button:hover { background: rgba(255, 255, 255, .05); }
    .custom .links svg { width: 18px; height: 18px; fill: none; stroke: var(--mist); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .custom .links .chev { margin-left: auto; width: 14px; height: 14px; }

    @media (max-width: 760px) {
      .stats dl { gap: 20px; }
      .stats dd { font-size: 30px; }
    }
    @media (max-height: 560px) { .stats { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .wall, .gear svg, .tile .sq { transition: none; }
      .pop { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wall" id="wall-a" aria-hidden="true"></div>
  <div class="wall" id="wall-b" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <div class="stage" id="stage">
    <div class="cell" data-pos="tl"></div><div class="cell" data-pos="tc"></div><div class="cell" data-pos="tr"></div>
    <div class="cell" data-pos="ml"></div><div class="cell" data-pos="mc"></div><div class="cell" data-pos="mr"></div>
    <div class="cell" data-pos="bl"></div><div class="cell" data-pos="bc"></div><div class="cell" data-pos="br"></div>
  </div>

  <!-- Widgets, placed into the stage by newtab.js -->
  <div id="widgets" hidden>
    <div class="widget" data-w="clock"><div class="clock" id="clock" aria-hidden="true"><div class="time" id="clock-time"></div><div class="date" id="clock-date"></div></div></div>
    <div class="widget" data-w="tiles"><nav aria-label="Raccourcis"><ul class="tiles" id="tiles"></ul></nav></div>
    <div class="widget" data-w="search">
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="q" placeholder="Rechercher sur le Web ou saisir une adresse" aria-label="Rechercher ou saisir une adresse" autocomplete="off" spellcheck="false" autofocus>
      </form>
    </div>
    <div class="widget" data-w="stats">
      <section class="stats" id="stats" aria-labelledby="stats-title">
        <h2 id="stats-title"><img src="emblem.png" alt="">Statistiques</h2>
        <dl>
          <div><dt>Traqueurs et publicités bloqués</dt><dd id="st-blocked">0</dd></div>
          <div><dt>Bande passante économisée</dt><dd id="st-bytes">0<small>Mo</small></dd></div>
          <div><dt>Temps gagné</dt><dd id="st-time">0<small>seconde</small></dd></div>
        </dl>
      </section>
    </div>
  </div>


  <button class="gear" id="gear" title="Personnaliser" aria-label="Personnaliser la page" aria-haspopup="dialog" aria-expanded="false" aria-controls="custom">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.6 7.6 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.7 7.7 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4.9 2-3.4Z"/></svg>
  </button>

  <div class="drop-zones" id="drop-zones" aria-hidden="true">
    <div data-pos="tl"></div><div data-pos="tc"></div><div data-pos="tr"></div>
    <div data-pos="ml"></div><div data-pos="mc"></div><div data-pos="mr"></div>
    <div data-pos="bl"></div><div data-pos="bc"></div><div data-pos="br"></div>
  </div>
  <div class="arrange-bar" id="arrange-bar">Faites glisser l’horloge, la recherche, les raccourcis ou les statistiques<button type="button" class="primary" id="arrange-done">Terminé</button></div>

  <form class="pop addform" id="addform" hidden aria-labelledby="add-title" novalidate>
    <h2 id="add-title">Ajouter un raccourci</h2>
    <label for="add-name">Nom</label>
    <input id="add-name" autocomplete="off" placeholder="Par exemple : Wikipédia">
    <label for="add-url">Adresse</label>
    <input id="add-url" autocomplete="off" spellcheck="false" placeholder="https://exemple.fr">
    <p class="err" id="add-err" hidden></p>
    <div class="actions">
      <button type="button" class="ghost" id="add-cancel">Annuler</button>
      <button type="submit" class="primary">Ajouter</button>
    </div>
  </form>

  <div class="pop custom" id="custom" role="dialog" aria-labelledby="custom-title" hidden>
    <h2 id="custom-title">Personnaliser</h2>
    <h3>Fond</h3>
    <div class="seg" id="bg-kind" role="group" aria-label="Type de fond">
      <button type="button" data-kind="wall">Paysages</button>
      <button type="button" data-kind="color">Couleur</button>
      <button type="button" data-kind="image">Votre image</button>
    </div>
    <div id="bg-wall"><div class="walls" id="walls"></div></div>
    <div id="bg-color" hidden><div class="swatches" id="swatches"></div></div>
    <div id="bg-image" hidden>
      <div class="img-pick"><img id="img-preview" alt="" hidden><button type="button" id="img-choose">Choisir une image…</button><button type="button" class="ghost" id="img-remove" hidden>Retirer</button></div>
      <input type="file" id="img-file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
    <label class="range"><span>Assombrir</span><input type="range" id="bg-dim" min="0" max="70" step="5"><output id="bg-dim-v"></output></label>
    <label class="range"><span>Flou</span><input type="range" id="bg-blur" min="0" max="24" step="2"><output id="bg-blur-v"></output></label>
    <h3>Éléments de la page</h3>
    <div id="wopts"></div>
    <div class="actions-row">
      <button type="button" id="arrange">Déplacer les éléments</button>
      <button type="button" class="ghost" id="layout-reset">Disposition d’origine</button>
    </div>
    <div class="links">
      <button type="button" id="go-security">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.3 3 7.8 7 9.5 4-1.7 7-5.2 7-9.5V6Z"/><path d="m9 12 2 2 4-4"/></svg>
        Security Center
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button type="button" id="go-settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        Paramètres
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <script src="nf.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
