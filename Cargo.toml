[workspace]
resolver = "2"
members = ["crates/*", "app", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MPL-2.0"
authors = ["NIGHTFALL contributors"]
repository = "https://github.com/BatStream-off/NIGHTFALL"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
nf-core = { path = "crates/nf-core" }
nf-crypto = { path = "crates/nf-crypto" }
nf-hwkey = { path = "crates/nf-hwkey" }
nf-auth = { path = "crates/nf-auth" }
nf-storage = { path = "crates/nf-storage" }
nf-security = { path = "crates/nf-security" }
nf-emergency = { path = "crates/nf-emergency" }
nf-shield = { path = "crates/nf-shield" }
nf-videoguard = { path = "crates/nf-videoguard" }
nf-vault = { path = "crates/nf-vault" }
nf-perf = { path = "crates/nf-perf" }
nf-downloads = { path = "crates/nf-downloads" }
nf-sync = { path = "crates/nf-sync" }
nf-update = { path = "crates/nf-update" }

# External crates (licences checked by cargo-deny, see deny.toml)
cef = { version = "=156.3.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
psl = "2"
idna = "1"
url = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tempfile = "3"
log = "0.4"
anyhow = "1"
semver = "1"

[profile.release]
lto = false
codegen-units = 16
strip = "symbols"
panic = "unwind"
